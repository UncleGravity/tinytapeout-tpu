[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pynqz1"
version = "0.1.0"
description = "PYNQ-Z1 Bonsai accelerator runtime and host backend"
requires-python = ">=3.10"

[tool.setuptools]
packages = [
    "proto",
    "host",
    "host.cli",
    "host.transport",
    "board",
    "board.daemon",
    "board.memory",
    "board.kernels",
    "board.kernels.ps",
    "board.kernels.pl",
    "board.profiling",
    "board.tools",
]

[tool.pytest.ini_options]
testpaths = [
    "proto/tests",
    "host/tests",
    "board/tests",
    "tests",
]

[tool.ruff]
line-length = 100
extend-exclude = ["**/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
