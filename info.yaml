# Tiny Tapeout project information
project:
  title: "1-Bit TPU"
  author: "Angel Viera"
  discord: "UncleGravity"
  description: "Tiny Tapeout 1-Bit Systolic Array"
  language: "SystemVerilog"
  clock_hz: 50000000 # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1" # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_".
  top_module: "tt_um_unclegravity_tpu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "rtl/w1a8_pe.v"
    - "rtl/w1a8_row.v"
    - "rtl/w1a8_array.v"
    - "rtl/tpu_cmd_decode.v"
    - "rtl/tpu_weight_mem.v"
    - "rtl/tpu_act_mem.v"
    - "rtl/tpu_acc_mem.v"
    - "rtl/tpu_tile_ctrl.v"
    - "rtl/tpu_status.v"
    - "rtl/project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs: ui_in[2:0]=cmd, ui_in[7:3]=arg (layout depends on cmd)
  ui[0]: "cmd[0]"
  ui[1]: "cmd[1]"
  ui[2]: "cmd[2]"
  ui[3]: "arg[0]"
  ui[4]: "arg[1]"
  ui[5]: "arg[2]"
  ui[6]: "arg[3]"
  ui[7]: "arg[4]"

  # Outputs: status byte, or RDP result byte when cmd=RDP
  uo[0]: "busy / result[0]"
  uo[1]: "done / result[1]"
  uo[2]: "wdone / result[2]"
  uo[3]: "adone / result[3]"
  uo[4]: "idle / result[4]"
  uo[5]: "idle / result[5]"
  uo[6]: "error / result[6]"
  uo[7]: "result[7]"

  # Bidirectional pins (input-only): host data byte for LDW/LDA/SEED
  uio[0]: "data_in[0]"
  uio[1]: "data_in[1]"
  uio[2]: "data_in[2]"
  uio[3]: "data_in[3]"
  uio[4]: "data_in[4]"
  uio[5]: "data_in[5]"
  uio[6]: "data_in[6]"
  uio[7]: "data_in[7]"

# Do not change!
yaml_version: 6
