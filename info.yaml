# Tiny Tapeout project information
project:
  title: "1-Bit TPU" # *Project title
  author: "UncleGravity" # *Your name
  discord: "" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "Tiny Tapeout Binary Systolic Array" # *One line description of what your project does
  language: "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 0 # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x2" # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_".
  top_module: "tt_um_unclegravity_tpu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "rtl/w1a8_pe.v"
    - "rtl/w1a8_row.v"
    - "rtl/w1a8_array.v"
    - "rtl/w1a8_tile_controller.v"
    - "rtl/project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "cmd[0]"
  ui[1]: "cmd[1]"
  ui[2]: "cmd[2]"
  ui[3]: "index[0]"
  ui[4]: "index[1]"
  ui[5]: "row"
  ui[6]: "reserved"
  ui[7]: "reserved"

  # Outputs
  uo[0]: "status/result[0]"
  uo[1]: "status/result[1]"
  uo[2]: "status/result[2]"
  uo[3]: "status/result[3]"
  uo[4]: "status/result[4]"
  uo[5]: "status/result[5]"
  uo[6]: "status/result[6]"
  uo[7]: "status/result[7]"

  # Bidirectional pins (used as inputs for the activation byte)
  uio[0]: "data_in[0] / weight row0"
  uio[1]: "data_in[1] / weight row1"
  uio[2]: "data_in[2]"
  uio[3]: "data_in[3]"
  uio[4]: "data_in[4]"
  uio[5]: "data_in[5]"
  uio[6]: "data_in[6]"
  uio[7]: "data_in[7]"

# Do not change!
yaml_version: 6
